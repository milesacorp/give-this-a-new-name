<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&family=Playfair+Display:wght@600&display=swap');
  * {
    padding: 0;
    margin: 0;
  }
  body {
    overflow: hidden;
  }
  canvas {
    width: 100vw;
    height: 100vh;
    border: none;
    display: none;
  }
  .loader {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: rgba(0, 0, 0, 0.8);
  }
  .loading-animation {
    width: 50px;
    height: 50px;
    border: 3px solid #fff;
    border-top-color: #3498db;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    100% {
      transform: rotate(360deg);
    }
  }
</style>

<script>
  var canvas = document.getElementById("canvas");
  var loader = document.querySelector(".loader");

    setTimeout(function() {
      loader.style.display = "none";
      canvas.style.display = "block";
    }, 2500)
</script>
<div id="fps-counter"></div>
<style>
    #fps-counter {
  position: fixed;
  top: 10px;
  right: 10px;
  font-size: 12px;
  color: white;
  background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent background */
  padding: 5px;
  border-radius: 5px;
  z-index: 1000; /* Ensure it stays on top */
}
</style>
<script>
    const fpsCounter = document.getElementById("fps-counter");

    // Utility function to get a cookie
    function getCookie(name) {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.startsWith(name + '=')) {
                return cookie.substring(name.length + 1);
            }
        }
        return null;
    }

    // Check if FPS Counter is enabled
    const fpsCounterEnabled = getCookie('fpsCounter') === 'true';

    if (fpsCounterEnabled) {
        fpsCounter.style.display = 'block'; // Show FPS counter

        function calculateFPS() {
            let lastFrameTime = performance.now();
            let frames = 0;

            function frameLoop() {
                const now = performance.now();
                frames++;

                if (now - lastFrameTime >= 1000) {
                    const fps = Math.round(frames / ((now - lastFrameTime) / 1000));
                    fpsCounter.textContent = `FPS: ${fps}`;
                    frames = 0;
                    lastFrameTime = now;
                }
                requestAnimationFrame(frameLoop);
            }
            frameLoop();
        }

        calculateFPS(); // Start FPS calculation
    } else {
        fpsCounter.style.display = 'none'; // Hide FPS counter
    }
</script>
