<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login and Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-4">Userbase Login and Signup</h1>
        <div id="form-container" class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <form id="signup-form">
                            <h2 class="h5 mb-3">Sign Up</h2>
                            <div class="mb-3">
                                <input type="text" id="signup-username" class="form-control" placeholder="Username (Email)" required>
                            </div>
                            <div class="mb-3">
                                <input type="password" id="signup-password" class="form-control" placeholder="Password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Sign Up</button>
                        </form>
                    </div>
                </div>
                <div class="card shadow-sm">
                    <div class="card-body">
                        <form id="login-form">
                            <h2 class="h5 mb-3">Login</h2>
                            <div class="mb-3">
                                <input type="text" id="login-username" class="form-control" placeholder="Username (Email)" required>
                            </div>
                            <div class="mb-3">
                                <input type="password" id="login-password" class="form-control" placeholder="Password" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Login</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
